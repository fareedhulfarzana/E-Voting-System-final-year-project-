    <script>
    function sendOTP() {
        let phone = document.getElementById("phoneNumber").value;
        
        if (!phone) {
            alert("Please enter a phone number.");
            return;
        }

        fetch("/send_otp", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: "phoneNumber=" + encodeURIComponent(phone)
        })
        .then(response => response.json())
        .then(data => {
            if (data.message) {
                alert(data.message);
            } else {
                alert("Error: " + data.error);
            }
        })
        .catch(error => console.error("Error:", error));
    }
</script>
<script>
    function verifyOTP() {
        let otp = document.getElementById("otp").value;
        let phone = document.getElementById("phoneNumber").value;

        fetch("/verify_otp", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ phoneNumber: phone, otp: otp })
        })
        .then(response => response.json())
        .then(data => {
            if (data.message) {
                alert(data.message);  // ✅ Show success message
            } else {
                alert("Error: " + data.error);  // ❌ Show error message
            }
        })
        .catch(error => console.error("Error:", error));
    }
</script>
<script>
    let otpVerified = false;

    function sendOTP() {
        let phone = document.getElementById("phoneNumber").value;

        if (!phone) {
            alert("Please enter a phone number.");
            return;
        }

        fetch("/send_otp", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: "phoneNumber=" + encodeURIComponent(phone)
        })
        .then(response => response.json())
        .then(data => {
            alert(data.message);
        })
        .catch(error => console.error("Error:", error));
    }

    function verifyOTP() {
        let otp = document.getElementById("otp").value;
        let phone = document.getElementById("phoneNumber").value;

        fetch("/verify_otp", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ phoneNumber: phone, otp: otp })
        })
        .then(response => response.json())
        .then(data => {
            if (data.message) {
                alert(data.message);
                otpVerified = true;
                document.getElementById("registerBtn").disabled = false;  // Enable Register button
            } else {
                alert("Error: " + data.error);
                otpVerified = false;
                document.getElementById("registerBtn").disabled = true;  // Keep Register button disabled
            }
        })
        .catch(error => console.error("Error:", error));
    }

    document.getElementById("registerForm").addEventListener("submit", function(event) {
        if (!otpVerified) {
            event.preventDefault();  // Stop form submission
            alert("Please enter a valid OTP before registering.");
        }
    });
</script>

<script>
document.getElementById("first_name").addEventListener("input", function () {
    this.value = this.value.replace(/[^A-Za-z]/g, '');
});

document.getElementById("last_name").addEventListener("input", function () {
    this.value = this.value.replace(/[^A-Za-z]/g, '');
});

document.getElementById("aadhaar_id").addEventListener("input", function () {
    this.value = this.value.replace(/[^0-9]/g, '');
    if (this.value.length > 12) {
        alert("Aadhaar ID must be exactly 12 digits.");
        this.value = this.value.slice(0, 12);
    }
});

document.getElementById("voter_id").addEventListener("input", function () {
    this.value = this.value.replace(/[^A-Za-z0-9]/g, '');
    if (this.value.length > 10) {
        alert("Voter ID must be exactly 10 characters (letters and digits).");
        this.value = this.value.slice(0, 10);
    }
});
</script>

<body>
    <div class="container">
        <h2>Voter Registration</h2>
        <form id="registerForm" action="/" method="POST" enctype="multipart/form-data">
         <label for="first_name">First Name:</label>
    <input type="text" id="first_name" name="first_name" required>
    <label for="last_name">Last Name:</label>
    <input type="text" id="last_name" name="last_name" required>
    <label for="voterId">Voter ID:</label>
    <input type="text" id="voterId" name="voterId" required maxlength="10">
    <label for="aadhaar_id">Aadhaar ID:</label>
    <input type="text" id="aadhaar_id" name="aadhaar_id" required maxlength="12">

    <label for="phoneNumber">Phone Number:</label>
    <input type="text" id="phoneNumber" name="phoneNumber" required>
    <button type="button" onclick="sendOTP()">Send OTP</button>

    <label for="otp">Enter OTP:</label>
    <input type="text" id="otp" name="otp" required>
    <button type="button" onclick="verifyOTP()">Verify OTP</button>

    <label for="aadhaarCard">Upload Aadhaar Card:</label>
    <input type="file" id="aadhaarCard" name="aadhaarCard" accept="image/*" required>

    <button type="submit" id="registerBtn" disabled>Register</button>
</form>

        <p>Already registered? <a href="{{ url_for('login') }}">Login here</a></p>
