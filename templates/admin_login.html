<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link rel="stylesheet" href="style.css">
     <style>
      /* Navbar */
 .navbar {
     display: flex;
     justify-content: space-between;
     align-items: center;
     background: #111;
     padding: 15px 40px;
     box-shadow: 0px 4px 10px rgba(0, 255, 0, 0.5);
     position: fixed;
     width: 100%;
     top: 0;
     left: 0;
     z-index: 1000;
      overflow: visible !important;
        width: 100vw;
     overflow: visible;
      
 }

 .navbar .logo img {
     width: 100px; /* Adjust logo size */
 }

 .navbar .menu {
     list-style: none;
     display: flex;
     gap: 30px;
         flex-wrap: wrap;
         margin-right:100px;

     
 }

 .navbar .menu li {
     display: inline;
         white-space: nowrap; /* Prevents text from breaking into multiple lines */

 }


 .navbar .menu li a {
     color: #00ff00;
     text-decoration: none;
     font-weight: bold;
     padding: 8px 12px;
     transition: 0.3s;
     
 }

 .navbar .menu li a:hover {
     background: #009900;
     border-radius: 5px;
 }</style>
    <style>
        body {
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
        }
        .login-container {
            background: #111;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px limegreen;
            width: 300px;
            margin:auto ;
            margin-top:100px;
        }
        h2 {
            color: limegreen;
        }
        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid limegreen;
            background: black;
            color: white;
            text-align: center;
        }
        button {
            width: 100%;
            padding: 10px;
            background: limegreen;
            color: black;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background: white;
            color: black;
        }
    </style>
</head>
<!-- Navbar -->
    <nav class="navbar">
        <div class="logo">
            <img src="party/logo.png">
        </div>
        <ul class="menu">
            <li><a href="{{ url_for('dashboard') }}">Home</a></li>
            <li><a href="{{ url_for('register') }}">Register</a></li>
            <li><a href="{{ url_for('login') }}">Login</a></li>
            <li><a href="{{ url_for('result_page') }}">Results</a></li>
            <li><a href="{{ url_for('admins_page') }}">Admin</a></li>
        </ul>
    </nav>
<body>

    <h2>Admin Login</h2>

    <div class="login-container">
        <form method="POST">
            <input type="text" name="username" placeholder="Admin ID" required><br>
            <input type="password" name="password" placeholder="Password" required><br>
            <button type="submit">Login</button>
        </form>
    </div>

</body>
</html>
