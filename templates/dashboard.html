<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
     /* Navbar */
.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #111;
    padding: 15px 40px;
    box-shadow: 0px 4px 10px rgba(0, 255, 0, 0.5);
    position: fixed;
    width: 100%;
    top: 0;
    left: 0;
    z-index: 1000;
     overflow: visible !important;
       width: 100vw;
    overflow: visible;
     
}

.navbar .logo img {
    width: 100px; /* Adjust logo size */
}

.navbar .menu {
    list-style: none;
    display: flex;
    gap: 30px;
        flex-wrap: wrap;
        margin-right:100px;

    
}

.navbar .menu li {
    display: inline;
        white-space: nowrap; /* Prevents text from breaking into multiple lines */

}


.navbar .menu li a {
    color: #00ff00;
    text-decoration: none;
    font-weight: bold;
    padding: 8px 12px;
    transition: 0.3s;
    
}

.navbar .menu li a:hover {
    background: #009900;
    border-radius: 5px;
}
    </style>

    <style>
        body {
            background-color: #111;
            color: #00ff00;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #222;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 255, 0, 0.5);
            text-align: center;
            width: 80%;
            max-width: 800px;
            height: 300px; /* Increased height */
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin-top:100px;
        }
        .register-btn {
            background: #00ff00;
            color: #111;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 20px;
            text-decoration: none;
            display: inline-block;
        }
        .register-btn:hover {
            background: #009900;
        }
    </style>
</head>
<body>
<!-- Navbar -->
    <nav class="navbar">
        <div class="logo">
            <img src="party/logo.png">
        </div>
        <ul class="menu">
            <li><a href="{{ url_for('dashboard') }}">Home</a></li>
            <li><a href="{{ url_for('register') }}">Register</a></li>
            <li><a href="{{ url_for('login') }}">Login</a></li>
            <li><a href="{{ url_for('result_page') }}">Results</a></li>
            <li><a href="{{ url_for('admins_page') }}">Admin</a></li>
        </ul>
    </nav>
    <div class="container">
        <h1>Welcome to Blockchain-Based E-Voting System</h1>
       <a href="{{ url_for('register') }}" class="register-btn">User Register</a>
    </div>
</body>
</html>
